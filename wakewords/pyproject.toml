[project]
name = "bob-wakewords"
version = "0.1.0"
description = "Training data and models for BOBAssistant wake words"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "torch>=2.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "openwakeword>=0.6.0",
    "piper-tts>=1.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin'"]
