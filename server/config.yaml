audio:
  sample_rate: 16000
  input_device: builtin
  output_device: null
  preroll_seconds: 3.0
  tv_mic_gain: 60

echo:
  partitions: 16
  mu: 0.2
  ref_gain: 8.0
  delay: 1600
  guard: 10.0

wake:
  engine: vosk
  vosk_model: models/vosk/vosk-model-small-ru-0.22
  vosk_url: https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
  grammar: [джарвис, джервис]
  decoys: [сервис, шарф, марвин, дарвин, харви, парис, жарко, гарвард, джаз, варвар, ярлык, джин, джинс, поп, бок, бык, бой, бабка, бубен, боб, пока, потом, вот, этот, так, как, что, это, да, нет, не, ну, я, ты, он, мы, вы, они, миллион, минута, минус, мини, минимум, марионетка, подряд, подарочный, подъезд, подробный, подручные, пододеяльник, сэр, сбор, сбыт, сверх, спер, сбербанк, сделай, включи, выключи, скажи, расскажи, какая, погода, сколько, будет, время, музыку, громче, тише, хватит, спасибо, пожалуйста, давай, поставь, сегодня, завтра, сейчас, можно, нужно, надо, хочу, знаю, думаю, скажите, покажи, открой, найди, мне, тебе, меня, тебя, его, её, их, лолита, династия, терапия, оксимирон, яникс, ясми, включить, песню, песня, альбом, исполнитель, дальше, назад, пауза, стоп]
  verify_with_stt: true
  triggers:
    jarvis: [[джарвис], [джервис]]

listen:
  max_seconds: 10
  silence_ms: 1000
  extend_ms: 2000
  barge_in: true
  followup_seconds: 5
  max_followups: 3
  conversation_seconds: 90
  followup_min_speech: 0.3
  start_timeout_seconds: 5
  speech_threshold: 0.5

stt:
  model: mlx-community/whisper-large-v3-mlx
  language: ru
  prompt: Джарвис. Какая погода в Белгороде, в Москве, в Курске, в Воронеже, в Санкт-Петербурге?

llm:
  provider: openai_compat
  base_url: http://localhost:11434/v1
  model: qwen3:30b-instruct
  api_key_env: null
  max_tokens: 400
  temperature: 0.3
  max_tool_rounds: 4
  session_minutes: 5

tts:
  engine: silero
  model_path: models/silero/v4_ru.pt
  model_url: https://models.silero.ai/models/tts/ru/v4_ru.pt
  sample_rate: 48000
  default_voice: alisa
  voices:
    alisa: {speaker: baya, speed: 1.0}
    minion: {speaker: aidar, speed: 1.6}
  by_wake:
    jarvis: alisa

music:
  volume: 0.8

persona:
  name: Джарвис

debug:
  log_text: false
  keep_utterances: 0
  keep_triggers: 0

network:
  host: 0.0.0.0
  port: 8765
  helper_port: 8766
  token_env: BOB_TOKEN

place:
  name: null
  latitude: null
  longitude: null
  timezone: Europe/Moscow
