audio:
  sample_rate: 16000
  input_device: null
  output_device: null
  preroll_seconds: 3.0

wake:
  engine: vosk
  vosk_model: models/vosk/vosk-model-small-ru-0.22
  vosk_url: https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
  grammar: [окей, ок, сбер, миньон, подручный, боб]
  verify_with_stt: true
  triggers:
    okey_sber: [[окей, сбер], [ок, сбер]]
    minion: [[миньон]]
    podruchny: [[подручный]]
    bob: [[боб]]

listen:
  max_seconds: 10
  silence_ms: 1200
  followup_seconds: 8
  start_timeout_seconds: 5
  speech_threshold: 0.5

stt:
  model: mlx-community/whisper-large-v3-turbo
  language: ru
  prompt: Боб, Окей Сбер, Миньон, Подручный.

llm:
  provider: openai_compat
  base_url: http://localhost:11434/v1
  model: qwen3:30b-instruct
  api_key_env: null
  max_tokens: 400
  temperature: 0.3
  max_tool_rounds: 4
  session_minutes: 5

tts:
  engine: silero
  model_path: models/silero/v4_ru.pt
  model_url: https://models.silero.ai/models/tts/ru/v4_ru.pt
  sample_rate: 48000
  default_voice: alisa
  voices:
    alisa: {speaker: baya, speed: 1.0}
    minion: {speaker: aidar, speed: 1.6}
  by_wake:
    okey_sber: alisa
    podruchny: alisa
    minion: minion
    bob: minion

persona:
  name: Боб

debug:
  log_text: false

network:
  host: 0.0.0.0
  port: 8765
  token_env: BOB_TOKEN

place:
  name: null
  latitude: null
  longitude: null
  timezone: Europe/Moscow
