[project]
name = "bob-server"
version = "0.1.0"
description = "BOBAssistant brain: wake words, speech, LLM tools, voice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "vosk>=0.3.42,<0.3.45",
    "silero-vad>=5.1",
    "onnxruntime>=1.18",
    "mlx-whisper>=0.4",
    "torch>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "num2words>=0.5.13",
    "ddgs>=9.0",
    "yandex-music>=3.2.2",
]

[project.scripts]
bob = "bob.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bob"]
